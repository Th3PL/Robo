<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="970" fill="#ffffff"/>

  <!-- ==================== TITULO ==================== -->
  <text x="40" y="50" font-size="27" font-weight="700" fill="#0f172a">Diagrama de Componentes — Robô Móvel com Controle Bluetooth</text>
  <text x="40" y="78" font-size="13.5" fill="#64748b">Arduino Uno R3 · Ponte H L298N · 2 motores DC · HC-SR04 · HC-05/HC-06 · bateria 7,4 V — visão de componentes, interfaces e responsabilidades</text>

  <!-- ==================== LEGENDAS DE COLUNA ==================== -->
  <text x="140"  y="128" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">EXTERNO</text>
  <text x="445"  y="128" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">PERIFÉRICOS</text>
  <text x="1405" y="128" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.2">TRAÇÃO E POTÊNCIA</text>

  <!-- ==================== EXTERNO: OPERADOR ==================== -->
  <rect x="40" y="148" width="200" height="95" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
  <text x="140" y="176" font-size="10.5" fill="#64748b" text-anchor="middle" font-style="italic">«ator externo»</text>
  <text x="140" y="199" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Operador</text>
  <text x="140" y="219" font-size="11.5" fill="#475569" text-anchor="middle">App Android de</text>
  <text x="140" y="234" font-size="11.5" fill="#475569" text-anchor="middle">terminal Bluetooth</text>

  <!-- ==================== PERIFERICO: HC-05 ==================== -->
  <rect x="330" y="148" width="230" height="95" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="445" y="176" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-style="italic">«componente · comunicação»</text>
  <text x="445" y="199" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">Módulo HC-05 / HC-06</text>
  <text x="445" y="219" font-size="11.5" fill="#6d28d9" text-anchor="middle">Ponte Bluetooth ↔ serial</text>
  <text x="445" y="234" font-size="11.5" fill="#6d28d9" text-anchor="middle">Perfil SPP · 5 V</text>

  <!-- ==================== PERIFERICO: HC-SR04 ==================== -->
  <rect x="330" y="304" width="230" height="95" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="445" y="332" font-size="10.5" fill="#16a34a" text-anchor="middle" font-style="italic">«componente · percepção»</text>
  <text x="445" y="355" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Sensor HC-SR04</text>
  <text x="445" y="375" font-size="11.5" fill="#166534" text-anchor="middle">Ultrassônico 2–400 cm</text>
  <text x="445" y="390" font-size="11.5" fill="#166534" text-anchor="middle">Voltado para a frente</text>

  <!-- ==================== ARDUINO (CONTAINER) ==================== -->
  <rect x="670" y="100" width="470" height="542" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="905" y="124" font-size="10.5" fill="#2563eb" text-anchor="middle" font-style="italic">«dispositivo · unidade de controle»</text>
  <text x="905" y="146" font-size="16.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Arduino Uno R3 — Firmware</text>

  <!-- 1. Comunicacao BT -->
  <rect x="692" y="165" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="189" font-size="13.5" font-weight="700" fill="#1e3a8a">Serviço de Comunicação BT</text>
  <text x="705" y="209" font-size="11" fill="#475569">SoftwareSerial · 9600 bps · recebe e valida bytes de comando</text>

  <!-- 2. Interpretador -->
  <rect x="692" y="243" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="267" font-size="13.5" font-weight="700" fill="#1e3a8a">Interpretador de Comandos</text>
  <text x="705" y="287" font-size="11" fill="#475569">F · T · E · D · P  →  traduz caractere em ação de movimento</text>

  <!-- 3. Servico de distancia -->
  <rect x="692" y="321" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="345" font-size="13.5" font-weight="700" fill="#1e3a8a">Serviço de Distância</text>
  <text x="705" y="365" font-size="11" fill="#475569">Dispara Trig, mede Echo e converte o tempo de eco em cm</text>

  <!-- 4. Supervisor de seguranca -->
  <rect x="692" y="399" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="423" font-size="13.5" font-weight="700" fill="#1e3a8a">Supervisor de Segurança</text>
  <text x="705" y="443" font-size="11" fill="#475569">Veta o avanço abaixo do limiar · fail-safe se a conexão BT cair</text>

  <!-- 5. Controle de movimento -->
  <rect x="692" y="477" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="501" font-size="13.5" font-weight="700" fill="#1e3a8a">Controle de Movimento</text>
  <text x="705" y="521" font-size="11" fill="#475569">frente() · re() · esquerda() · direita() · parar()</text>

  <!-- 6. Driver ponte H -->
  <rect x="692" y="555" width="426" height="62" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="705" y="579" font-size="13.5" font-weight="700" fill="#1e3a8a">Driver da Ponte H</text>
  <text x="705" y="599" font-size="11" fill="#475569">Sentido em IN1–IN4 · velocidade por PWM em ENA / ENB</text>

  <!-- fluxo interno -->
  <line x1="905" y1="227" x2="905" y2="241" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="905" y1="383" x2="905" y2="397" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="905" y1="461" x2="905" y2="475" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="905" y1="539" x2="905" y2="553" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- comando interpretado vai direto ao supervisor (canal lateral) -->
  <path d="M 1118 284 L 1130 284 L 1130 430 L 1120 430" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ==================== CONEXOES EXTERNAS ==================== -->
  <!-- operador <-> HC-05 -->
  <text x="285" y="180" font-size="10.5" fill="#475569" text-anchor="middle">Bluetooth SPP</text>
  <text x="285" y="192" font-size="10.5" fill="#94a3b8" text-anchor="middle">2,4 GHz</text>
  <line x1="240" y1="205" x2="330" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

  <!-- HC-05 <-> Arduino -->
  <text x="615" y="180" font-size="10.5" fill="#475569" text-anchor="middle">UART 9600 bps</text>
  <text x="615" y="192" font-size="10.5" fill="#94a3b8" text-anchor="middle">D10 (RX) · D11 (TX)</text>
  <line x1="560" y1="205" x2="670" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

  <!-- HC-SR04 -> Arduino -->
  <text x="615" y="336" font-size="10.5" fill="#475569" text-anchor="middle">Trig D9 · Echo D8</text>
  <text x="615" y="348" font-size="10.5" fill="#94a3b8" text-anchor="middle">tempo de eco</text>
  <line x1="560" y1="361" x2="670" y2="361" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

  <!-- Arduino -> L298N -->
  <text x="1195" y="562" font-size="10.5" fill="#475569" text-anchor="middle">IN1–IN4 · ENA/ENB</text>
  <text x="1195" y="574" font-size="10.5" fill="#94a3b8" text-anchor="middle">sinais lógicos 5 V</text>
  <line x1="1140" y1="586" x2="1250" y2="586" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ==================== TRACAO E POTENCIA ==================== -->
  <rect x="1236" y="228" width="338" height="428" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- rodas -->
  <rect x="1250" y="250" width="310" height="82" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1405" y="275" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-style="italic">«componente mecânico»</text>
  <text x="1405" y="297" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">Tração diferencial</text>
  <text x="1405" y="317" font-size="11.5" fill="#475569" text-anchor="middle">2 rodas motrizes + roda boba</text>

  <!-- motor 1 -->
  <rect x="1250" y="390" width="150" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1325" y="415" font-size="10" fill="#b45309" text-anchor="middle" font-style="italic">«atuador»</text>
  <text x="1325" y="437" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Motor 1</text>
  <text x="1325" y="457" font-size="11.5" fill="#b45309" text-anchor="middle">DC — lado direito</text>
  <text x="1325" y="475" font-size="11" fill="#b45309" text-anchor="middle">N20 500 rpm</text>

  <!-- motor 2 -->
  <rect x="1410" y="390" width="150" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1485" y="415" font-size="10" fill="#b45309" text-anchor="middle" font-style="italic">«atuador»</text>
  <text x="1485" y="437" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Motor 2</text>
  <text x="1485" y="457" font-size="11.5" fill="#b45309" text-anchor="middle">DC — lado esquerdo</text>
  <text x="1485" y="475" font-size="11" fill="#b45309" text-anchor="middle">N20 500 rpm</text>

  <!-- L298N -->
  <rect x="1250" y="536" width="310" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1405" y="561" font-size="10.5" fill="#dc2626" text-anchor="middle" font-style="italic">«componente · potência»</text>
  <text x="1405" y="583" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Ponte H L298N</text>
  <text x="1405" y="603" font-size="11.5" fill="#b91c1c" text-anchor="middle">2 canais · sentido + PWM</text>
  <text x="1405" y="621" font-size="11.5" fill="#b91c1c" text-anchor="middle">isola a lógica da potência</text>

  <!-- L298N -> motores -->
  <line x1="1325" y1="536" x2="1325" y2="502" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1485" y1="536" x2="1485" y2="502" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1332" y="524" font-size="9.5" fill="#475569">OUT1 / OUT2</text>
  <text x="1492" y="524" font-size="9.5" fill="#475569">OUT3 / OUT4</text>

  <!-- motores -> rodas -->
  <line x1="1325" y1="390" x2="1325" y2="334" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1485" y1="390" x2="1485" y2="334" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1332" y="366" font-size="9.5" fill="#475569">torque</text>
  <text x="1492" y="366" font-size="9.5" fill="#475569">torque</text>

  <!-- ==================== SUBSISTEMA DE ENERGIA ==================== -->
  <rect x="40" y="690" width="950" height="190" rx="12" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.6"/>
  <text x="62" y="720" font-size="11.5" font-weight="700" fill="#78716c" letter-spacing="1.2">SUBSISTEMA DE ENERGIA</text>

  <rect x="62" y="740" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="162" y="768" font-size="13.5" font-weight="700" fill="#44403c" text-anchor="middle">Bateria 7,4 V</text>
  <text x="162" y="788" font-size="11" fill="#57534e" text-anchor="middle">2× Li-ion 18650</text>
  <text x="162" y="805" font-size="11" fill="#57534e" text-anchor="middle">em série</text>

  <rect x="292" y="740" width="170" height="78" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="377" y="768" font-size="13.5" font-weight="700" fill="#44403c" text-anchor="middle">F1 + chave geral</text>
  <text x="377" y="788" font-size="11" fill="#57534e" text-anchor="middle">fusível de proteção</text>
  <text x="377" y="805" font-size="11" fill="#57534e" text-anchor="middle">e corte de emergência</text>

  <rect x="492" y="740" width="180" height="78" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="582" y="768" font-size="13.5" font-weight="700" fill="#44403c" text-anchor="middle">Barramento VM</text>
  <text x="582" y="788" font-size="11" fill="#57534e" text-anchor="middle">7,4 V para a</text>
  <text x="582" y="805" font-size="11" fill="#57534e" text-anchor="middle">etapa de potência</text>

  <rect x="702" y="740" width="210" height="78" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="807" y="768" font-size="13.5" font-weight="700" fill="#44403c" text-anchor="middle">Regulador 5 V</text>
  <text x="807" y="788" font-size="11" fill="#57534e" text-anchor="middle">embarcado na L298N</text>
  <text x="807" y="805" font-size="11" fill="#57534e" text-anchor="middle">alimenta a lógica</text>

  <line x1="262" y1="779" x2="292" y2="779" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="462" y1="779" x2="492" y2="779" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="672" y1="779" x2="702" y2="779" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="62" y="852" font-size="11.5" fill="#57534e">5 V → Arduino · HC-05/HC-06 · HC-SR04    |    7,4 V → L298N (VM) → motores    |    GND comum entre lógica e potência</text>

  <!-- ==================== SUBSISTEMA ESTRUTURAL ==================== -->
  <rect x="1030" y="690" width="530" height="190" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1052" y="720" font-size="11.5" font-weight="700" fill="#64748b" letter-spacing="1.2">SUBSISTEMA ESTRUTURAL (CAD)</text>

  <rect x="1052" y="740" width="230" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1167" y="768" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Chassi impresso em 3D</text>
  <text x="1167" y="788" font-size="11" fill="#475569" text-anchor="middle">cad/stl/robo_arduino.3mf</text>
  <text x="1167" y="805" font-size="11" fill="#475569" text-anchor="middle">≈150 g de filamento</text>

  <rect x="1308" y="740" width="230" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1423" y="768" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Suportes e fixação</text>
  <text x="1423" y="788" font-size="11" fill="#475569" text-anchor="middle">Arduino · L298N · bateria</text>
  <text x="1423" y="805" font-size="11" fill="#475569" text-anchor="middle">sensor · motores · rodas</text>

  <text x="1052" y="852" font-size="11.5" fill="#475569">Sensor fixado voltado para a frente · cabos afastados das rodas (T31)</text>

  <!-- ==================== LEGENDA ==================== -->
  <rect x="40" y="905" width="12" height="12" rx="3" fill="#eef2f7" stroke="#64748b" stroke-width="1.2"/>
  <text x="60" y="915" font-size="11.5" fill="#475569">Externo</text>

  <rect x="140" y="905" width="12" height="12" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="160" y="915" font-size="11.5" fill="#475569">Comunicação</text>

  <rect x="270" y="905" width="12" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="290" y="915" font-size="11.5" fill="#475569">Percepção</text>

  <rect x="390" y="905" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="410" y="915" font-size="11.5" fill="#475569">Controle / firmware</text>

  <rect x="550" y="905" width="12" height="12" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="570" y="915" font-size="11.5" fill="#475569">Potência</text>

  <rect x="665" y="905" width="12" height="12" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="685" y="915" font-size="11.5" fill="#475569">Atuação</text>

  <rect x="780" y="905" width="12" height="12" rx="3" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.2"/>
  <text x="800" y="915" font-size="11.5" fill="#475569">Energia</text>

  <rect x="890" y="905" width="12" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="910" y="915" font-size="11.5" fill="#475569">Estrutura</text>

  <text x="1560" y="915" font-size="10.5" fill="#94a3b8" text-anchor="end">hardware/diagrama-componentes.svg</text>
</svg>
